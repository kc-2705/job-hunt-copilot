# Render Blueprint.
# - job-hunt-copilot-web: the website, a static site. Free static sites never sleep, so it opens
#   instantly and shows an opening animation while it wakes the API.
# - job-hunt-copilot: the API (it also serves the app). On the free plan it sleeps after 15 idle minutes.
# MONGO_URL and GROQ_API_KEY are secrets: Render asks for them when the service is created.
services:
  - type: web
    name: job-hunt-copilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      # The website's address, so browsers there may call this API.
      - key: CLIENT_URL
        fromService:
          name: job-hunt-copilot-web
          type: web
          property: host

  - type: web
    name: job-hunt-copilot-web
    runtime: static
    buildCommand: npm ci --prefix client --include=dev && npm run build --prefix client
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: false
    routes:
      # Every page is the same React app; let it handle the address.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Where the website finds the API.
      - key: VITE_API_URL
        fromService:
          name: job-hunt-copilot
          type: web
          property: host
