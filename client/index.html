<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Job Hunt Copilot: match your resume to any job post with AI, tailor your bullets, draft cover letters and track applications." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>Job Hunt Copilot</title>
  </head>
  <body>
    <!-- Opening screen: shows at once (plain HTML/CSS) while the app loads and the API wakes up. -->
    <div id="splash" role="status" aria-live="polite">
      <style>
        #splash {
          --s-bg: #f5f6fb; --s-text: #1e1b3a; --s-muted: #6b6f85; --s-brand: #4f46e5; --s-track: #e4e6f0; --s-card: #ffffff;
          position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--s-bg);
          font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--s-text);
          transition: opacity .5s ease, visibility .5s;
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme='light']) #splash { --s-bg: #0d0f1a; --s-text: #e8e9f3; --s-muted: #9a9db3; --s-brand: #818cf8; --s-track: #272b3f; --s-card: #161927; }
        }
        :root[data-theme='dark'] #splash { --s-bg: #0d0f1a; --s-text: #e8e9f3; --s-muted: #9a9db3; --s-brand: #818cf8; --s-track: #272b3f; --s-card: #161927; }
        #splash.done { opacity: 0; visibility: hidden; }
        #splash .stage { display: grid; justify-items: center; gap: 22px; padding: 0 24px; text-align: center; }
        #splash .scene { position: relative; width: 240px; height: 150px; }
        #splash .doc {
          position: absolute; top: 28px; width: 70px; height: 92px; border-radius: 10px; background: var(--s-card);
          box-shadow: 0 8px 24px rgba(30, 27, 58, .12); padding: 12px 10px; display: grid; gap: 7px; align-content: start;
        }
        #splash .doc i { display: block; height: 6px; border-radius: 3px; background: var(--s-track); }
        #splash .doc i:first-child { width: 60%; background: var(--s-brand); opacity: .8; }
        #splash .doc i:nth-child(3) { width: 80%; }
        #splash .doc i:nth-child(5) { width: 70%; }
        #splash .resume { left: 0; animation: s-left 1.1s cubic-bezier(.2, .8, .2, 1) both; }
        #splash .job { right: 0; animation: s-right 1.1s cubic-bezier(.2, .8, .2, 1) both; }
        #splash .ring { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; transform: translate(-50%, -50%); }
        #splash .ring circle { fill: none; stroke-width: 7; }
        #splash .ring .track { stroke: var(--s-track); }
        #splash .ring .arc { stroke: var(--s-brand); stroke-linecap: round; stroke-dasharray: 302; stroke-dashoffset: 302;
          transform: rotate(-90deg); transform-origin: center; animation: s-arc 1.4s .7s ease-out forwards; }
        #splash .logo { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%) scale(.6);
          opacity: 0; animation: s-pop .6s .55s cubic-bezier(.3, 1.6, .5, 1) forwards; }
        #splash .spark { transform-origin: 44px 19px; animation: s-twinkle 1.6s 1.3s ease-in-out infinite; }
        #splash h1 { margin: 0; font: 700 26px/1.2 'Space Grotesk', Inter, sans-serif; letter-spacing: -.01em; opacity: 0; animation: s-up .6s 1s forwards; }
        #splash p { margin: 0; color: var(--s-muted); font-size: 15px; opacity: 0; animation: s-up .6s 1.2s forwards; }
        #splash .wake { min-height: 44px; display: grid; gap: 10px; justify-items: center; opacity: 0; transition: opacity .4s; }
        #splash.waiting .wake { opacity: 1; }
        #splash .bar { width: 180px; height: 4px; border-radius: 2px; background: var(--s-track); overflow: hidden; }
        #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--s-brand); animation: s-slide 1.3s ease-in-out infinite; }
        #splash .wake span { font-size: 13px; color: var(--s-muted); }
        @keyframes s-left { from { transform: translateX(-40px) rotate(-8deg); opacity: 0; } to { transform: translateX(0) rotate(-6deg); opacity: 1; } }
        @keyframes s-right { from { transform: translateX(40px) rotate(8deg); opacity: 0; } to { transform: translateX(0) rotate(6deg); opacity: 1; } }
        @keyframes s-arc { to { stroke-dashoffset: 30; } }
        @keyframes s-pop { to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes s-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes s-twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
        @keyframes s-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; } }
      </style>
      <div class="stage">
        <div class="scene" aria-hidden="true">
          <div class="doc resume"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="doc job"><i></i><i></i><i></i><i></i><i></i></div>
          <svg class="ring" viewBox="0 0 112 112"><circle class="track" cx="56" cy="56" r="48" /><circle class="arc" cx="56" cy="56" r="48" /></svg>
          <svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#4f46e5" /><rect x="16" y="24" width="32" height="24" rx="5" fill="none" stroke="#fff" stroke-width="4" /><path d="M26 24v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#fff" stroke-width="4" /><path class="spark" d="M44 12l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fde68a" /></svg>
        </div>
        <h1>Job Hunt Copilot</h1>
        <p>Matching your resume to the job…</p>
        <div class="wake"><div class="bar"></div><span id="splash-note">Waking up the free server. This can take up to a minute.</span></div>
      </div>
    </div>
    <script>
      try { var t = localStorage.getItem('jobcopilot.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
